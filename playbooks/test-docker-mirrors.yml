---
- name: Test and configure working Docker mirrors
  hosts: all
  become: yes
  tasks:
    - name: Test multiple Docker mirrors
      ansible.builtin.shell: |
        echo "Testing mirror: {{ item }}"
        timeout 10 docker pull hello-world --registry-mirror={{ item }} 2>&1 | head -5
        echo "Exit code: $?"
        echo "---"
      register: mirror_test
      loop:
        - https://docker.1ms.run
        - https://hub.rat.dev
        - https://docker.xuanyuan.me
        - https://dockermirror.com
        - https://docker.nju.edu.cn
        - https://mirrors.ustc.edu.cn
        - https://mirror.ccs.tencentyun.com
      failed_when: false
      changed_when: false

    - name: Display mirror test results
      ansible.builtin.debug:
        msg: "{{ mirror_test.results | map(attribute='stdout') | list }}"

    - name: Configure Docker with best available mirror
      ansible.builtin.copy:
        content: |
          {
            "registry-mirrors": [
              "https://docker.1ms.run",
              "https://hub.rat.dev",
              "https://docker.xuanyuan.me"
            ],
            "dns": ["8.8.8.8", "1.1.1.1", "223.5.5.5"],
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
        daemon_reload: yes
