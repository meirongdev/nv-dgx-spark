---
- name: Configure Qwen Code CLI to talk to local vLLM
  hosts: all
  become: false
  gather_facts: false
  vars:
    vllm_base_url: "http://localhost:30000/v1"
    vllm_api_key: "dummy"
    vllm_model: "Qwen3.6-35B-A3B"
    qwen_home: "{{ ansible_env.HOME | default('/home/admin') }}/.qwen"

  tasks:
    - name: Ensure ~/.qwen exists
      ansible.builtin.file:
        path: "{{ qwen_home }}"
        state: directory
        mode: "0755"

    - name: Write ~/.qwen/.env (OpenAI-compatible creds → local vLLM)
      ansible.builtin.copy:
        dest: "{{ qwen_home }}/.env"
        mode: "0600"
        content: |
          OPENAI_API_KEY={{ vllm_api_key }}
          OPENAI_BASE_URL={{ vllm_base_url }}
          OPENAI_MODEL={{ vllm_model }}

    - name: Ensure ~/.qwen/settings.json exists with model pinned
      ansible.builtin.copy:
        dest: "{{ qwen_home }}/settings.json"
        mode: "0644"
        force: false
        content: |
          {
            "security": { "auth": { "selectedType": "openai" } },
            "model": { "name": "{{ vllm_model }}" },
            "$version": 3
          }

    - name: Install qwen wrapper that strips SOCKS proxy env vars
      # qwen-code uses undici, which rejects SOCKS proxies at startup
      # (normalizeProxyUrl → "SOCKS proxy is not supported"). The shell
      # ~/.bashrc exports HTTP_PROXY=socks5://... for other tools, so we
      # wrap `qwen` to unset proxy vars only for this command. Target is
      # localhost:30000 — already in NO_PROXY, so no proxy is needed.
      # Note: `env` cannot exec the shell builtin `command`, so the wrapper
      # must call the binary by absolute path.
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME | default('/home/admin') }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK qwen-no-socks"
        block: |
          qwen() {
            env -u ALL_PROXY -u HTTP_PROXY -u HTTPS_PROXY \
                -u all_proxy -u http_proxy -u https_proxy \
                /usr/local/bin/qwen "$@"
          }

    - name: Smoke test — list models via local vLLM
      ansible.builtin.shell: |
        set -e
        curl -sf {{ vllm_base_url }}/models \
          -H "Authorization: Bearer {{ vllm_api_key }}" \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); print("models:", [m["id"] for m in d["data"]])'
      register: smoke
      changed_when: false

    - name: Show smoke-test result
      ansible.builtin.debug:
        msg: "{{ smoke.stdout_lines }}"
