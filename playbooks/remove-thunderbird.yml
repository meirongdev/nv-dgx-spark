---
- name: Remove Thunderbird from all hosts
  hosts: all
  gather_facts: false

  tasks:
    - name: Remove Thunderbird snap package
      ansible.builtin.shell: |
        sudo snap remove --purge thunderbird || sudo snap remove thunderbird || echo "Snap thunderbird removal failed or already removed"
      register: snap_remove_result
      changed_when: true
      failed_when: false

    - name: Display snap removal result
      ansible.builtin.debug:
        var: snap_remove_result.stdout_lines

    - name: Remove any apt thunderbird packages
      ansible.builtin.apt:
        name: thunderbird
        state: absent
        purge: true
        autoremove: true
      register: apt_remove_result
      changed_when: true
      failed_when: false

    - name: Display apt removal result
      ansible.builtin.debug:
        var: apt_remove_result.stdout_lines if apt_remove_result.stdout_lines is defined else "No apt packages to remove"

    - name: Verify thunderbird is removed
      ansible.builtin.shell: |
        which thunderbird 2>/dev/null || echo "Thunderbird not found - successfully removed"
        snap list thunderbird 2>/dev/null || echo "No snap thunderbird"
      register: verify_result
      changed_when: false
      failed_when: false

    - name: Display verification result
      ansible.builtin.debug:
        var: verify_result.stdout_lines
