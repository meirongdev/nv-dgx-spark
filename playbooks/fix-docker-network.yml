---
- name: Fix Docker network issues on DGX Spark
  hosts: all
  become: yes
  tasks:
    - name: Remove unreliable mirrors and use direct registry
      ansible.builtin.copy:
        content: |
          {
            "registry-mirrors": [],
            "dns": ["8.8.8.8", "1.1.1.1"],
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'

    - name: Restart Docker to apply changes
      ansible.builtin.systemd:
        name: docker
        state: restarted
        daemon_reload: yes

    - name: Test Docker pull (hello-world)
      ansible.builtin.shell: |
        docker pull hello-world
      register: pull_result
      retries: 3
      delay: 10
      until: pull_result.rc == 0
      failed_when: pull_result.rc != 0
      changed_when: true

    - name: Display pull result
      ansible.builtin.debug:
        msg: "Docker pull test completed successfully"
