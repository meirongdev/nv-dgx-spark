---
# vLLM Test & Validation Playbook
# 
# Usage: ansible-playbook -i inventory.ini playbooks/vllm-test.yml --ssh-extra-args="-i /Users/matthew/.ssh/vgio"

- name: Test vLLM Deployment
  hosts: servers
  gather_facts: no
  vars:
    vllm_port: 8000
    vllm_model: "Qwen/Qwen2.5-7B-Instruct"
    ssh_user: "admin"

  tasks:
    - name: Check if vLLM container is running
      ansible.builtin.command: docker ps --filter name=vllm-server --format "{{.Status}}"
      register: container_status
      changed_when: false
      failed_when: false

    - name: Display container status
      ansible.builtin.debug:
        msg: "Container status: {{ container_status.stdout | default('NOT RUNNING') }}"

    - name: Get GPU utilization
      ansible.builtin.command: nvidia-smi --query-gpu=utilization.gpu,utilization.memory,memory.used,memory.total --format=csv,noheader
      register: gpu_util
      changed_when: false
      failed_when: false

    - name: Display GPU utilization
      ansible.builtin.debug:
        msg: |
          GPU Utilization:
          {{ gpu_util.stdout }}

    - name: Test vLLM health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ vllm_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      register: health_result
      ignore_errors: yes

    - name: Display health check result
      ansible.builtin.debug:
        msg: |
          Health Check: {{ 'PASSED' if health_result.status == 200 else 'FAILED' }}
          Response: {{ health_result.json | default('No response') }}

    - name: Test vLLM completions endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ vllm_port }}/v1/completions"
        method: POST
        body_format: json
        body:
          model: "{{ vllm_model }}"
          prompt: "Hello, how are you?"
          max_tokens: 20
          temperature: 0.7
        status_code: 200
        timeout: 60
      register: completion_result
      ignore_errors: yes

    - name: Display completion test result
      ansible.builtin.debug:
        msg: |
          Completions Test: {{ 'PASSED' if completion_result.status == 200 else 'FAILED' }}
          {% if completion_result.status == 200 %}
          Response: {{ completion_result.json.choices[0].text | default('No text in response') }}
          {% else %}
          Error: {{ completion_result.msg | default('Unknown error') }}
          {% endif %}

    - name: Test vLLM chat endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ vllm_port }}/v1/chat/completions"
        method: POST
        body_format: json
        body:
          model: "{{ vllm_model }}"
          messages:
            - role: user
              content: "Hello, what can you do?"
          max_tokens: 50
          temperature: 0.7
        status_code: 200
        timeout: 60
      register: chat_result
      ignore_errors: yes

    - name: Display chat test result
      ansible.builtin.debug:
        msg: |
          Chat Test: {{ 'PASSED' if chat_result.status == 200 else 'FAILED' }}
          {% if chat_result.status == 200 %}
          Response: {{ chat_result.json.choices[0].message.content | default('No message in response') | truncate(200) }}
          {% else %}
          Error: {{ chat_result.msg | default('Unknown error') }}
          {% endif %}

    - name: Get vLLM model info
      ansible.builtin.uri:
        url: "http://localhost:{{ vllm_port }}/v1/models"
        method: GET
        status_code: 200
        timeout: 10
      register: models_result
      ignore_errors: yes

    - name: Display available models
      ansible.builtin.debug:
        msg: |
          Available Models:
          {% if models_result.status == 200 %}
          {% for model in models_result.json.data %}
          - {{ model.id }}
          {% endfor %}
          {% else %}
          Could not retrieve models
          {% endif %}

    - name: Check container logs for errors
      ansible.builtin.command: docker logs vllm-server --tail 50
      register: container_logs
      changed_when: false
      failed_when: false

    - name: Display recent logs
      ansible.builtin.debug:
        msg: |
          Recent Container Logs (last 50 lines):
          {{ container_logs.stdout }}
        verbosity: 1

    - name: Generate test summary
      ansible.builtin.debug:
        msg: |
          ========================================
          vLLM Test Summary for {{ inventory_hostname }}
          ========================================
          Container Running: {{ container_status.stdout | default('NO') }}
          Health Check: {{ 'PASSED' if health_result.status == 200 else 'FAILED' }}
          Completions API: {{ 'PASSED' if completion_result.status == 200 else 'FAILED' }}
          Chat API: {{ 'PASSED' if chat_result.status == 200 else 'FAILED' }}
          GPU Utilization: {{ gpu_util.stdout | default('UNKNOWN') }}
          ========================================
          Quick Test: curl http://{{ inventory_hostname }}:{{ vllm_port }}/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model": "{{ vllm_model }}", "messages": [{"role": "user", "content": "Hello"}], "max_tokens": 50}'
          ========================================
