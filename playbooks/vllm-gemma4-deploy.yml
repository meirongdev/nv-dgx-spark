---
- name: Deploy vLLM (Gemma-4-31B-IT) on DGX Spark cluster
  hosts: servers
  become: no
  gather_facts: yes
  vars:
    vllm_image: "vllm-node-tf5:latest"
    vllm_model: "/root/.cache/huggingface/hub/Gemma-4-31B-IT-NVFP4"
    vllm_served_name: "Gemma-4-31B-IT"
    vllm_port: 30000
    vllm_gpu_mem: "0.70"
    vllm_kv_dtype: "fp8_e4m3"
    vllm_container: "vllm-gemma4"
    vllm_tool_parser: "gemma4"
    vllm_reasoning_parser: ""
    vllm_max_model_len: "32768"
    vllm_max_num_seqs: "64"
    hf_cache_dir: "/home/admin/.cache/huggingface"
    vllm_launcher_path: "/home/admin/run-vllm-qwen.sh"
    vllm_patch_script_src: "../scripts/patch-vllm-chat-utils.py"
    vllm_patch_script_path: "/home/admin/patch-vllm-chat-utils.py"
    vllm_entrypoint_src: "../scripts/vllm-entrypoint.sh"
    vllm_entrypoint_path: "/home/admin/vllm-entrypoint.sh"

  tasks:
    - name: Disable swap (critical for unified memory)
      ansible.builtin.command: swapoff -a
      changed_when: true
      failed_when: false

    - name: Verify GPU is visible
      ansible.builtin.command: nvidia-smi --query-gpu=name --format=csv,noheader
      register: gpu_name
      changed_when: false

    - name: Display GPU info
      ansible.builtin.debug:
        msg: "GPU detected: {{ gpu_name.stdout }}"

    - name: Check Gemma-4-31B-IT-NVFP4 model is present
      ansible.builtin.stat:
        path: "{{ hf_cache_dir }}/hub/Gemma-4-31B-IT-NVFP4"
      register: model_dir

    - name: Fail if model not found
      ansible.builtin.fail:
        msg: "Model not found at {{ hf_cache_dir }}/hub/Gemma-4-31B-IT-NVFP4"
      when: not model_dir.stat.exists

    - name: Copy vLLM launcher script
      ansible.builtin.copy:
        src: ../scripts/run-vllm-qwen.sh
        dest: "{{ vllm_launcher_path }}"
        mode: "0755"

    - name: Copy vLLM chat_utils patch script
      ansible.builtin.copy:
        src: "{{ vllm_patch_script_src }}"
        dest: "{{ vllm_patch_script_path }}"
        mode: "0644"

    - name: Copy vLLM entrypoint wrapper
      ansible.builtin.copy:
        src: "{{ vllm_entrypoint_src }}"
        dest: "{{ vllm_entrypoint_path }}"
        mode: "0755"

    - name: Stop any previous vLLM container
      ansible.builtin.command: "docker rm -f {{ vllm_container }} vllm-qwen"
      changed_when: true
      failed_when: false

    - name: Launch vLLM server with Gemma-4
      ansible.builtin.command: "{{ vllm_launcher_path }}"
      environment:
        VLLM_MODEL: "{{ vllm_model }}"
        VLLM_SERVED_NAME: "{{ vllm_served_name }}"
        VLLM_IMAGE: "{{ vllm_image }}"
        VLLM_PORT: "{{ vllm_port }}"
        VLLM_GPU_MEM: "{{ vllm_gpu_mem }}"
        VLLM_KV_DTYPE: "{{ vllm_kv_dtype }}"
        VLLM_CONTAINER: "{{ vllm_container }}"
        VLLM_TOOL_PARSER: "{{ vllm_tool_parser }}"
        VLLM_REASONING_PARSER: "{{ vllm_reasoning_parser }}"
        VLLM_MOE_FP8: ""
        VLLM_MAX_MODEL_LEN: "{{ vllm_max_model_len }}"
        VLLM_MAX_NUM_SEQS: "{{ vllm_max_num_seqs }}"
        VLLM_MAX_NUM_BATCHED: ""
        VLLM_HF_CACHE: "{{ hf_cache_dir }}"
        VLLM_CHAT_TEMPLATE: ""
        VLLM_PATCH_SCRIPT: "{{ vllm_patch_script_path }}"
        VLLM_ENTRYPOINT_SCRIPT: "{{ vllm_entrypoint_path }}"
      register: vllm_launch
      changed_when: true

    - name: Wait for vLLM API to be ready (up to 15 minutes for Gemma-4)
      ansible.builtin.uri:
        url: "http://localhost:{{ vllm_port }}/v1/models"
        method: GET
        status_code: 200
      register: result
      until: result.status == 200
      retries: 90
      delay: 10
      failed_when: false

    - name: Report readiness
      ansible.builtin.debug:
        msg: >-
          vLLM {{ 'READY' if result.status == 200 else 'NOT READY (check docker logs vllm-gemma4)' }}
          on {{ inventory_hostname }}

    - name: Show vLLM status
      ansible.builtin.shell: |
        echo "=== Container ==="
        docker ps --filter "name={{ vllm_container }}" --format "table {{'{{'}}.Names{{'}}'}}\t{{'{{'}}.Status{{'}}'}}"
        echo ""
        echo "=== GPU ==="
        nvidia-smi --query-gpu=utilization.gpu,utilization.memory,memory.used,memory.total --format=csv,noheader
        echo ""
        echo "=== API Models ==="
        curl -s http://localhost:{{ vllm_port }}/v1/models 2>/dev/null | python3 -m json.tool || echo "Not responding"
      register: vllm_status
      changed_when: false

    - name: Display vLLM status
      ansible.builtin.debug:
        msg: "{{ vllm_status.stdout_lines }}"
