---
- name: Deploy single-node vLLM on each DGX Spark
  hosts: servers
  become: no
  gather_facts: yes
  vars:
    vllm_image: "nvcr.io/nvidia/vllm:26.01-py3"
    vllm_model: "Qwen/Qwen2.5-7B-Instruct"
    vllm_port: 8030
    gpu_memory_utilization: 0.7
    tool_call_parser: ""
    vllm_container_name: "vllm-server"
    hf_cache_dir: "/home/admin/.cache/huggingface"
    container_hf_cache_dir: "/root/.cache/huggingface"

  tasks:
    - name: Disable swap (critical for unified memory)
      ansible.builtin.command: swapoff -a
      changed_when: true
      failed_when: false

    - name: Configure OOM protection for SSH
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        line: "vm.oom_kill_allocating_task=0"
        state: present
      become: yes
      failed_when: false

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl -p
      become: yes
      failed_when: false

    - name: Add admin to docker group
      ansible.builtin.user:
        name: admin
        groups: docker
        append: yes
      become: yes
      failed_when: false

    - name: Verify docker is installed
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Verify GPU is visible
      ansible.builtin.command: nvidia-smi --query-gpu=name --format=csv,noheader
      register: gpu_name
      changed_when: false

    - name: Display GPU info
      ansible.builtin.debug:
        msg: "GPU detected: {{ gpu_name.stdout }}"

    - name: Stop any previous vLLM container
      ansible.builtin.command: docker rm -f {{ vllm_container_name }}
      changed_when: true
      failed_when: false

    - name: Pull vLLM Docker image
      ansible.builtin.command: "docker pull {{ vllm_image }}"
      changed_when: true
      failed_when: false

    - name: Ensure HuggingFace cache directory exists
      ansible.builtin.file:
        path: "{{ hf_cache_dir }}"
        state: directory
        mode: "0755"

    - name: Build vLLM tool calling arguments
      ansible.builtin.set_fact:
        vllm_tool_args: >-
          {{ '--enable-auto-tool-choice --tool-call-parser ' + tool_call_parser if tool_call_parser != '' else '' }}

    - name: Deploy vLLM container
      ansible.builtin.command: >
        docker run -d
        --name {{ vllm_container_name }}
        --net=host
        --gpus all
        --ipc=host
        --cap-add=SYS_ADMIN
        --security-opt=no-new-privileges
        -v {{ hf_cache_dir }}:{{ container_hf_cache_dir }}
        -e VLLM_ATTENTION_BACKEND=FLASHINFER
        -e VLLM_USE_FLASHINFER_MOE_FP8=1
        -e CUDA_VISIBLE_DEVICES=0
        -e VLLM_GPU_MEMORY_UTILIZATION={{ gpu_memory_utilization }}
        -e VLLM_KV_CACHE_DTYPE=fp8
        -e VLLM_MODEL={{ vllm_model }}
        -e VLLM_MAX_MODEL_LEN=32768
        -e VLLM_DTYPE=auto
        -e VLLM_TENSOR_PARALLEL_SIZE=1
        -e VLLM_MAX_NUM_SEQS=128
        -e VLLM_TRUST_REMOTE_CODE=true
        -e VLLM_LOGGING_LEVEL=INFO
        -e NCCL_P2P_DISABLE=0
        -e NCCL_SOCKET_IFNAME=enp1s0f0np0
        -e NCCL_IB_DISABLE=1
        {{ vllm_image }}
        vllm serve {{ vllm_model }}
        --host 0.0.0.0
        --port {{ vllm_port }}
        --gpu-memory-utilization {{ gpu_memory_utilization }}
        --dtype auto
        --kv-cache-dtype fp8
        --max-model-len 32768
        --tensor-parallel-size 1
        --enable-chunked-prefill
        --max-num-seqs 128
        --trust-remote-code
        {{ vllm_tool_args }}

    - name: Wait for vLLM API to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ vllm_port }}/v1/models"
        method: GET
        status_code: 200
      register: result
      until: result.status == 200
      retries: 60
      delay: 10
      failed_when: false

    - name: Check vLLM status
      ansible.builtin.shell: |
        echo "Container: {{ vllm_container_name }}"
        docker ps --filter "name={{ vllm_container_name }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        echo ""
        echo "GPU Utilization:"
        nvidia-smi --query-gpu=utilization.gpu,utilization.memory,memory.used,memory.total --format=csv,noheader
      register: vllm_status
      changed_when: false

    - name: Display vLLM status
      ansible.builtin.debug:
        msg: "{{ vllm_status.stdout_lines }}"
