---
- name: Configure passwordless sudo for admin user
  hosts: all
  gather_facts: false
  vars_prompt:
    - name: sudo_password
      prompt: Enter admin sudo password
      private: true

  tasks:
    - name: Configure passwordless sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/admin
        line: "admin ALL=(ALL) NOPASSWD:ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"
      become: true
      become_method: su
      become_user: root

    - name: Verify configuration
      ansible.builtin.shell: cat /etc/sudoers.d/admin
      register: result
      changed_when: false

    - name: Show result
      ansible.builtin.debug:
        var: result.stdout
