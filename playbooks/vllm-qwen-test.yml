---
- name: Test vLLM Qwen deployment
  hosts: servers
  become: no
  gather_facts: no
  vars:
    vllm_port: 30000
    vllm_model: "Qwen3.5-122B-A10B"

  tasks:
    - name: Test health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ vllm_port }}/health"
        method: GET
        status_code: 200
      register: health

    - name: Test models endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ vllm_port }}/v1/models"
        method: GET
        status_code: 200
      register: models

    - name: Display available models
      ansible.builtin.debug:
        msg: "{{ models.json }}"

    - name: Test chat completions
      ansible.builtin.shell: |
        curl -s http://localhost:{{ vllm_port }}/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
            "model": "{{ vllm_model }}",
            "messages": [{"role": "user", "content": "Say hello in 5 words."}],
            "max_tokens": 30
          }'
      register: chat_result

    - name: Display chat response
      ansible.builtin.debug:
        msg: "{{ chat_result.stdout | from_json }}"

    - name: Test tool calling (agent support validation)
      ansible.builtin.shell: |
        curl -s http://localhost:{{ vllm_port }}/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
            "model": "{{ vllm_model }}",
            "messages": [{"role": "user", "content": "What is 42 * 17?"}],
            "tools": [{
              "type": "function",
              "function": {
                "name": "calculate",
                "description": "Perform arithmetic calculation",
                "parameters": {
                  "type": "object",
                  "properties": {"expression": {"type": "string", "description": "Math expression"}},
                  "required": ["expression"]
                }
              }
            }],
            "tool_choice": "auto",
            "max_tokens": 100
          }'
      register: tool_result

    - name: Display tool calling response
      ansible.builtin.debug:
        msg: "{{ tool_result.stdout | from_json }}"

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: health={{ health.status }},
          models={{ models.status }},
          chat={{ 'OK' if chat_result.rc == 0 else 'FAIL' }},
          tools={{ 'OK' if tool_result.rc == 0 else 'FAIL' }}
