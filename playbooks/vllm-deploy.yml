---
# vLLM Deployment Playbook for DGX Spark (GB10, Blackwell sm_121)
# April 2026 - Best practices for unified memory architecture
# 
# Usage: ansible-playbook -i inventory.ini playbooks/vllm-deploy.yml --ssh-extra-args="-i /Users/matthew/.ssh/vgio"

- name: Deploy vLLM on DGX Spark
  hosts: servers
  become: yes
  gather_facts: yes
  vars:
    vllm_image: "nvcr.io/nvidia/vllm:26.01-py3"
    vllm_model: "Qwen/Qwen2.5-7B-Instruct"
    vllm_port: 8000
    gpu_memory_utilization: 0.7
    max_model_len: 32768
    kv_cache_dtype: "fp8"
    ssh_user: "admin"

  tasks:
    # ========================================
    # Phase 1: System Hardening (Critical!)
    # ========================================
    
    - name: Check system prerequisites
      block:
        - name: Verify Docker is installed
          ansible.builtin.command: docker --version
          register: docker_version
          changed_when: false
          
        - name: Display Docker version
          ansible.builtin.debug:
            msg: "Docker version: {{ docker_version.stdout }}"

        - name: Verify GPU is accessible
          ansible.builtin.command: nvidia-smi --query-gpu=name --format=csv,noheader
          register: gpu_check
          changed_when: false
          
        - name: Display GPU info
          ansible.builtin.debug:
            msg: "GPU: {{ gpu_check.stdout }}"

        - name: Check available memory
          ansible.builtin.command: free -b
          register: mem_info
          changed_when: false
          
        - name: Display memory info
          ansible.builtin.debug:
            msg: "System memory: {{ mem_info.stdout_lines[1] }}"

    - name: Disable swap (Critical for unified memory)
      block:
        - name: Disable swap immediately
          ansible.builtin.command: swapoff -a
          changed_when: true
          
        - name: Remove swap from fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: '.*swap.*'
            state: absent
          notify: Verify swap disabled
          
        - name: Drop caches to free memory
          ansible.builtin.command: sh -c 'sync && echo 3 > /proc/sys/vm/drop_caches'
          changed_when: true
      rescue:
        - name: Warn about swap disable failure
          ansible.builtin.debug:
            msg: "WARNING: Could not disable swap. This may cause OOM issues with vLLM."

    - name: Add admin user to docker group
      block:
        - name: Ensure docker group exists
          ansible.builtin.group:
            name: docker
            state: present
            
        - name: Add admin to docker group
          ansible.builtin.user:
            name: "{{ ssh_user }}"
            groups: docker
            append: yes
          register: docker_group_result
          
        - name: Display docker group status
          ansible.builtin.debug:
            msg: "User {{ ssh_user }} added to docker group"
          when: docker_group_result.changed

    - name: Configure OOM protection for SSH
      block:
        - name: Create SSH service override directory
          ansible.builtin.file:
            path: /etc/systemd/system/ssh.service.d
            state: directory
            mode: '0755'
            
        - name: Create SSH OOM protection override
          ansible.builtin.copy:
            content: |
              [Service]
              OOMScoreAdjust=-1000
              MemoryMin=512M
            dest: /etc/systemd/system/ssh.service.d/oom-protect.conf
            mode: '0644'
          register: ssh_oom_config
          
        - name: Reload systemd if SSH config changed
          ansible.builtin.systemd:
            daemon_reload: yes
          when: ssh_oom_config.changed

    - name: Create vLLM configuration directory
      ansible.builtin.file:
        path: /etc/vllm
        state: directory
        mode: '0755'
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"

    - name: Deploy vLLM environment file
      ansible.builtin.copy:
        src: ../config/vllm.env
        dest: /etc/vllm/vllm.env
        mode: '0644'
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
      notify: Restart vLLM service

    # ========================================
    # Phase 2: Deploy vLLM Container
    # ========================================

    - name: Pull vLLM Docker image
      ansible.builtin.command: "docker pull {{ vllm_image }}"
      register: pull_result
      changed_when: "'Downloaded' in pull_result.stdout or 'Downloaded' in pull_result.stderr"
      failed_when: false
      timeout: 600

    - name: Display pull result
      ansible.builtin.debug:
        msg: "Using image: {{ vllm_image }}"

    - name: Stop any existing vLLM container
      ansible.builtin.command: docker stop vllm-server
      register: stop_result
      changed_when: true
      failed_when: false

    - name: Remove any existing vLLM container
      ansible.builtin.command: docker rm -f vllm-server
      changed_when: true
      failed_when: false

    - name: Deploy vLLM container
      ansible.builtin.command: >
        docker run -d
        --name vllm-server
        --restart unless-stopped
        --gpus all
        --network host
        --ipc=host
        --ulimit memlock=-1
        --ulimit stack=67108864
        -v /home/{{ ssh_user }}/.cache/huggingface:/root/.cache/huggingface
        -e VLLM_ATTENTION_BACKEND={{ lookup('env', 'VLLM_ATTENTION_BACKEND') | default('FLASHINFER') }}
        -e VLLM_USE_FLASHINFER_MOE_FP8={{ lookup('env', 'VLLM_USE_FLASHINFER_MOE_FP8') | default('1') }}
        -e VLLM_FLASHINFER_MOE_BACKEND={{ lookup('env', 'VLLM_FLASHINFER_MOE_BACKEND') | default('latency') }}
        -e VLLM_GPU_MEMORY_UTILIZATION={{ gpu_memory_utilization }}
        -e VLLM_KV_CACHE_DTYPE={{ kv_cache_dtype }}
        -e CUDA_VISIBLE_DEVICES=0
        {{ vllm_image }}
        vllm serve {{ vllm_model }}
        --host 0.0.0.0
        --port {{ vllm_port }}
        --gpu-memory-utilization {{ gpu_memory_utilization }}
        --kv-cache-dtype {{ kv_cache_dtype }}
        --dtype auto
        --max-model-len {{ max_model_len }}
        --max-num-seqs 128
        --trust-remote-code
      register: run_result
      changed_when: true
      failed_when: false

    - name: Display container start status
      ansible.builtin.debug:
        msg: "vLLM container started: {{ 'SUCCESS' if run_result.rc == 0 else 'FAILED - check logs' }}"

    - name: Wait for vLLM to be ready
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ vllm_port }}"
        state: started
        delay: 30
        timeout: 300
      ignore_errors: yes
      register: health_check

    - name: Verify vLLM health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ vllm_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      register: health_result
      ignore_errors: yes
      retries: 5
      delay: 10

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ========================================
          vLLM Deployment Summary
          ========================================
          Host: {{ inventory_hostname }}
          Image: {{ vllm_image }}
          Model: {{ vllm_model }}
          Port: {{ vllm_port }}
          GPU Memory Utilization: {{ gpu_memory_utilization }}
          KV Cache Dtype: {{ kv_cache_dtype }}
          Max Model Length: {{ max_model_len }}
          ========================================
          Health Check: {{ 'PASSED' if health_result.status == 200 else 'PENDING - wait for model loading' }}
          ========================================
          Test with: curl http://{{ inventory_hostname }}:{{ vllm_port }}/v1/completions \
            -H "Content-Type: application/json" \
            -d '{"model": "{{ vllm_model }}", "prompt": "Hello", "max_tokens": 10}'
          ========================================

  handlers:
    - name: Verify swap disabled
      ansible.builtin.command: swapon --show
      register: swap_status
      changed_when: false
      failed_when: false
      
    - name: Restart vLLM service
      ansible.builtin.command: docker restart vllm-server
      failed_when: false
