---
- name: Validate vLLM TP=2 deployment
  hosts: servers
  become: no
  gather_facts: no
  vars:
    tp2_coordinator: "100.97.87.120"
    tp2_model: "Qwen3.5-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled"
    tp2_port: 8000
    tp2_container_name: "vllm-tp2"

  tasks:
    - name: Read TP=2 container logs
      ansible.builtin.command: docker logs {{ tp2_container_name }} --tail 400
      register: tp2_logs
      changed_when: false
      failed_when: false

    - name: Assert distributed startup markers exist
      ansible.builtin.assert:
        that:
          - >
            'tensor_parallel_size' in tp2_logs.stdout or
            '--tensor-parallel-size' in tp2_logs.stdout or
            'world_size=2' in tp2_logs.stdout or
            'Worker_TP' in tp2_logs.stdout or
            'Application startup complete.' in tp2_logs.stdout
        fail_msg: "TP=2 markers not found in container logs on {{ inventory_hostname }}"

    - name: Check health endpoint on coordinator
      ansible.builtin.uri:
        url: "http://{{ tp2_coordinator }}:{{ tp2_port }}/health"
        method: GET
        status_code: 200
        timeout: 20
      run_once: true

    - name: Check models endpoint on coordinator
      ansible.builtin.uri:
        url: "http://{{ tp2_coordinator }}:{{ tp2_port }}/v1/models"
        method: GET
        status_code: 200
        timeout: 20
      register: models_result
      run_once: true

    - name: Assert target model is exposed
      ansible.builtin.assert:
        that:
          - tp2_model in (models_result.json.data | map(attribute='id') | list)
      run_once: true

    - name: Run smoke completion on coordinator
      ansible.builtin.uri:
        url: "http://{{ tp2_coordinator }}:{{ tp2_port }}/v1/completions"
        method: POST
        body_format: json
        body:
          model: "{{ tp2_model }}"
          prompt: "Say hello in one sentence."
          max_tokens: 32
          temperature: 0
        status_code: 200
        timeout: 120
      register: smoke_completion
      run_once: true
