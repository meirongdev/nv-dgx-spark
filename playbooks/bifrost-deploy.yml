---
- name: Deploy Bifrost LLM Gateway
  hosts: "{{ bifrost_host | default('100.97.87.120') }}"
  become: no
  gather_facts: yes
  vars:
    bifrost_image: "maximhq/bifrost:latest"
    bifrost_port: 8080
    bifrost_container_name: "bifrost-gateway"
    bifrost_config_remote_path: "/home/admin/bifrost-config.json"

  tasks:
    - name: Verify docker is installed
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Stop any previous Bifrost container
      ansible.builtin.command: docker rm -f {{ bifrost_container_name }}
      changed_when: true
      failed_when: false

    - name: Deploy Bifrost configuration file
      ansible.builtin.copy:
        src: ../config/bifrost-config.json
        dest: "{{ bifrost_config_remote_path }}"
        mode: "0644"

    - name: Pull Bifrost image (non-fatal — fall back to local cache)
      ansible.builtin.command: docker pull {{ bifrost_image }}
      changed_when: true
      failed_when: false
      register: bifrost_pull

    - name: Verify Bifrost image is available locally
      ansible.builtin.command: docker image inspect {{ bifrost_image }}
      changed_when: false

    - name: Deploy Bifrost container
      ansible.builtin.command: >
        docker run -d
        --name {{ bifrost_container_name }}
        --net=host
        --restart unless-stopped
        -v {{ bifrost_config_remote_path }}:/app/data/config.json
        {{ bifrost_image }}

    - name: Wait for Bifrost API to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ bifrost_port }}/api/health"
        method: GET
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 5
      failed_when: false

    - name: Collect Bifrost status
      ansible.builtin.shell: |
        set +e
        echo "=== Container ==="
        docker ps --filter "name={{ bifrost_container_name }}"
        echo ""
        echo "=== Registered Providers ==="
        curl -s http://localhost:{{ bifrost_port }}/api/providers | python3 -m json.tool 2>/dev/null || echo "N/A"
        echo ""
        echo "=== Models (OpenAI-compatible) ==="
        curl -s http://localhost:{{ bifrost_port }}/v1/models | python3 -m json.tool 2>/dev/null || echo "N/A"
      register: bifrost_status
      changed_when: false

    - name: Display Bifrost status
      ansible.builtin.debug:
        msg: "{{ bifrost_status.stdout_lines }}"
