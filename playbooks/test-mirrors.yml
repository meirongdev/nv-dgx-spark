---
- name: Test Docker mirrors one by one
  hosts: all
  become: yes
  vars:
    mirrors_to_test:
      - https://docker.1ms.run
      - https://docker.xuanyuan.me
      - https://docker.m.daocloud.io
      - https://atomhub.openatom.cn

  tasks:
    - name: Test mirror {{ item }}
      ansible.builtin.copy:
        content: |
          {
            "registry-mirrors": ["{{ item }}"]
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
        daemon_reload: yes

    - name: Wait for Docker
      ansible.builtin.wait_for:
        timeout: 5

    - name: Pull hello-world
      ansible.builtin.shell: |
        timeout 30 docker pull hello-world 2>&1
      register: pull_result
      failed_when: false
      changed_when: true

    - name: Show result for {{ item }}
      ansible.builtin.debug:
        msg: "Mirror {{ item }}: rc={{ pull_result.rc }}, stdout={{ pull_result.stdout | default('') }}, stderr={{ pull_result.stderr | default('') }}"

    - name: Save result
      ansible.builtin.lineinfile:
        path: /tmp/mirror-test-results.txt
        line: "{{ item }}: rc={{ pull_result.rc }}"
        create: yes
      changed_when: false
