recipe_version: "1"
name: DeepSeek-V4-Flash
description: DeepSeek V4 Flash 0731 FP8 on dual DGX Spark TP=2 (jasl/vllm SM12x) + DSpark
model: /root/.cache/huggingface/hub/DeepSeek-V4-Flash-0731
container: vllm-node-dsv4
cluster_only: true

build_args:
  - --vllm-repo
  - https://github.com/jasl/vllm.git
  - --vllm-ref
  - codex/ds4-sm120-min-enable
  - --rebuild-vllm

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  gpu_memory_utilization: 0.80
  max_model_len: 1000000
  max_num_batched_tokens: 8192
  max_num_seqs: 6
  block_size: 256
  served_model_name: deepseek-v4-flash

env:
  TORCH_CUDA_ARCH_LIST: 12.1a
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  VLLM_TRITON_MLA_SPARSE: 1
  FLASHINFER_DISABLE_VERSION_CHECK: 1
  TILELANG_CLEANUP_TEMP_FILES: 1
  DG_JIT_USE_NVRTC: 0
  DG_JIT_NVCC_COMPILER: /usr/local/cuda/bin/nvcc
  DG_JIT_PRINT_COMPILER_COMMAND: 1
  NCCL_IB_DISABLE: 0
  NCCL_DEBUG: WARN

# 2026-07-31 官方模型卡对齐:
#  - --override-generation-config top_p=0.95:卡片对 agentic 场景的建议
#    (卡片 temperature 1.0 已经是 generation_config.json 的默认值)。
#  - speculative-config 里的 draft_sample_method=greedy 只是把卡片建议写显式,
#    本 build 里它本来就是默认值(vllm/config/speculative.py:282),所以改前改后
#    tok/s 没有变化(56.8/55.2 → 57.9/57.7/55.5/51.0),不用再重复测这一项。
#  - num_speculative_tokens 保持 5 不动:卡片给的 7 在 GB10 上更慢(见 c1bb15c)。
command: |
  vllm serve /root/.cache/huggingface/hub/DeepSeek-V4-Flash-0731 \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --pipeline-parallel-size {pipeline_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --enable-prefix-caching \
      --max-model-len 1000000 \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens 8192 \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --distributed-executor-backend mp \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"greedy"}}' \
      --override-generation-config '{{"top_p":0.95}}' \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}}' \
      --default-chat-template-kwargs '{{"thinking":true}}' \
      --load-format safetensors
