upstream:
  repo: https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks
  commit: 8f29c6dd42da           # 2026-09-16T08:25Z
  license: AGPL-3.0              # 网络服务需提供源码;DFlash2 另为 CC BY-NC-ND 4.0(禁商用)
  path_on_s1: /home/admin/glm53-exl3
  # ⚠️ **为什么钉 8f29c6dd 而不是 HEAD**:镜像 :exl3-instanttensor 构建于
  # 2026-09-16T10:12,对应的就是这个 commit(也是上游 issue #204 里写的
