# qwen38fn-worker — rank1 --headless, S2 (spark-2435), 无 API 端点
# 健康语义 = 进程存活 (vllm 是容器 PID 1,退出即重启);无 HTTP 探针。
#
# ⚠️ 改本文件的**探针字段**要重建 Pod 才生效,而单独 `kubectl apply -f worker.yaml`
# 会只重建 worker → leader 独活 = 僵尸 TP 组(gotcha #1,与引擎无关,是 TP=2 的
# 固有性质)。正确做法成对来:
#   make qwen38fn-stop && kubectl apply -f k8s/qwen38fn/   # apply 把 replicas 收敛回 1
# (脚本本体不受此限——ConfigMap 热更,见 configmap-launch.yaml。)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38fn-worker
  namespace: qwen38fn
spec:
  replicas: 1            # 稳态 1;停机用 make qwen38fn-stop
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38fn-worker
  template:
    metadata:
      labels:
        app: qwen38fn-worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: spark-2435
      hostNetwork: true
      hostIPC: true
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: docker.io/library/vllm-qwen38fn:latest
          imagePullPolicy: Never
          command: ["/bin/bash", "/scripts/rank1.sh"]
          workingDir: /workspace
          securityContext:
            privileged: true
          resources:
            limits:
              nvidia.com/gpu: 1
          env:
            - name: VLLM_HOST_IP
              value: "192.168.200.102"
            - name: NCCL_SOCKET_IFNAME
              value: "enp1s0f0np0"
            - name: GLOO_SOCKET_IFNAME
              value: "enp1s0f0np0"
            - name: TP_SOCKET_IFNAME
              value: "enp1s0f0np0"
            - name: UCX_NET_DEVICES
              value: "enp1s0f0np0"
            - name: OMPI_MCA_btl_tcp_if_include
              value: "enp1s0f0np0"
            - name: MN_IF_NAME
              value: "enp1s0f0np0"
            - name: NCCL_IB_HCA
              value: "rocep1s0f0,roceP2p1s0f0"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_IGNORE_CPU_AFFINITY
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: vllm-cache
              mountPath: /root/.cache/vllm
            - name: flashinfer-cache
              mountPath: /root/.cache/flashinfer
            - name: triton-cache
              mountPath: /root/.triton
            - name: scripts
              mountPath: /scripts
          # 共同命运:worker 是 --headless,没有自己的端点可探。判据 = 「leader 还是不是
          # 我当初 rendezvous 的那个进程」——不是就自杀,两侧一起重来重新 rendezvous。
          # 脚本与 v4flash 的 worker_liveness.py **逐字相同**(它 fail-open 到「首次
          # 见到 leader」为止,所以 leader 装 8–11min 也不会误杀 worker —— 这正是
          # 当初把 initialDelaySeconds 从 900 拆掉的原因,换引擎后无需再调)。
          livenessProbe:
            exec:
              command: ["python3", "/scripts/worker_liveness.py"]
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 15
            # 脚本内已有连续 miss 计数(MISS_LIMIT=2),这里只留一次探针超时的余量。
            failureThreshold: 2
      volumes:
        - name: hf-cache
          hostPath:
            path: /home/admin/.cache/huggingface
        - name: vllm-cache
          hostPath:
            path: /home/admin/.cache/vllm
        - name: flashinfer-cache
          hostPath:
            path: /home/admin/.cache/flashinfer
        - name: triton-cache
          hostPath:
            path: /home/admin/.triton
        - name: scripts
          configMap:
            name: qwen38fn-launch
            defaultMode: 0755
