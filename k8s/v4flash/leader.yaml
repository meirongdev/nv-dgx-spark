# v4flash-leader — rank0, S1 (spark-ccf3), 对外 :8000 (hostNetwork)
# 形态 1:1 复刻生产 docker run: --privileged --ipc=host --network host --gpus all
apiVersion: apps/v1
kind: Deployment
metadata:
  name: v4flash-leader
  namespace: v4flash
spec:
  replicas: 1            # 稳态 1(切换已完成 2026-08-13);停机用 make v4flash-stop
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: v4flash-leader
  template:
    metadata:
      annotations:
        # 有了 warmer sidecar 之后,kubectl logs / exec 默认走哪个容器由它决定。
        # 少了这条,make v4flash-logs 和 probe-verify 都会要求显式 -c。
        kubectl.kubernetes.io/default-container: vllm
      labels:
        app: v4flash-leader
    spec:
      nodeSelector:
        kubernetes.io/hostname: spark-ccf3
      hostNetwork: true
      hostIPC: true
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: docker.io/library/vllm-node-dsv4:latest
          imagePullPolicy: Never
          command: ["/bin/bash", "/scripts/rank0.sh"]
          workingDir: /workspace
          securityContext:
            privileged: true          # RoCE 设备访问 (对齐 docker --privileged)
          resources:
            limits:
              nvidia.com/gpu: 1       # 统一内存上仅做调度记账,无内存隔离
          env:
            - name: VLLM_HOST_IP
              value: "192.168.200.101"
            - name: NCCL_SOCKET_IFNAME
              value: "enp1s0f0np0"
            - name: GLOO_SOCKET_IFNAME
              value: "enp1s0f0np0"
            - name: TP_SOCKET_IFNAME
              value: "enp1s0f0np0"
            - name: UCX_NET_DEVICES
              value: "enp1s0f0np0"
            - name: OMPI_MCA_btl_tcp_if_include
              value: "enp1s0f0np0"
            - name: MN_IF_NAME
              value: "enp1s0f0np0"
            - name: NCCL_IB_HCA
              value: "rocep1s0f0,roceP2p1s0f0"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_IGNORE_CPU_AFFINITY
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            # JIT 缓存三兄弟 —— 2026-09-02 从线上收编。丢了它们每次 Pod 重启都要
            # 重编译 kernel(正是 warmer sidecar 在替它遮掩的那部分开销)。
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /root/.cache/torchinductor
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: vllm-cache
              mountPath: /root/.cache/vllm
            - name: flashinfer-cache
              mountPath: /root/.cache/flashinfer
            - name: triton-cache
              mountPath: /root/.triton
            - name: tilelang-cache
              mountPath: /root/.tilelang
            - name: cuda-cache
              mountPath: /root/.nv
            - name: inductor-cache
              mountPath: /root/.cache/torchinductor
            - name: scripts
              mountPath: /scripts
          startupProbe:               # 167GB 权重加载 + 初始化,给足 30min
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          # ⚠️ /health 和 /v1/models 都是静态端点,TP 组挂死时它们照常 200,
          # 所以 readiness 探到的只是「API server 进程活着」。真正的存活判据在
          # /scripts/liveness.py:「有活但**持续**零进展」= 卡死(注释里有完整推理
          # 和 2026-08-13 / 2026-08-16 两代探针的三次误杀事故)。
          # ⚠️ 判死时长由脚本里的 STALL_S 决定(默认 600s),不是下面的
          # failureThreshold —— 这样调阈值改 ConfigMap 即可,不用重建两个 rank。
          # 下面三个字段只是额外余量(再给 3×60s),别再收紧。
          livenessProbe:
            exec:
              command: ["python3", "/scripts/liveness.py"]
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
        # warmer sidecar —— 2026-09-02 从线上收编。重启后自动预热(覆盖首个真实请求
        # 本该承担的 ~20 个 Triton JIT 事件),并在空闲后探测 benchmarking-cn.md 里
        # 那条「~30min 后 decode 掉 ~30%」的衰减(记录进 warmer.jsonl)。
        # ⚠️ 它发的是**真实请求**,会计入 /metrics 的 request_success_total 与
        #    spec_decode 接受率 —— 看"真实流量接受率"时要把 count300 剔除。
        - name: warmer
          image: docker.io/library/vllm-node-dsv4:latest
          imagePullPolicy: Never
          command: ["/bin/bash", "-c", "while true; do python3 /scripts/warmer.py || true; sleep 30; done"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: vllm-cache          # warmer.jsonl 落在这里,跨 Pod 重启保留
              mountPath: /root/.cache/vllm
      volumes:
        - name: hf-cache
          hostPath:
            path: /home/admin/.cache/huggingface
        - name: vllm-cache
          hostPath:
            path: /home/admin/.cache/vllm
        - name: flashinfer-cache
          hostPath:
            path: /home/admin/.cache/flashinfer
        - name: triton-cache
          hostPath:
            path: /home/admin/.triton
        - name: tilelang-cache
          hostPath:
            path: /home/admin/.tilelang
            type: DirectoryOrCreate
        - name: cuda-cache
          hostPath:
            path: /home/admin/.nv
            type: DirectoryOrCreate
        - name: inductor-cache
          hostPath:
            path: /home/admin/.cache/torchinductor
            type: DirectoryOrCreate
        - name: scripts
          configMap:
            name: v4flash-launch
            defaultMode: 0755
