# v4flash-worker — rank1 --headless, S2 (spark-2435), 无 API 端点
# 健康语义 = 进程存活 (vllm 是容器 PID 1,退出即重启);无 HTTP 探针。
#
# ⚠️ 改本文件的**探针字段**要重建 Pod 才生效,而单独 `kubectl apply -f worker.yaml`
# 会只重建 worker → leader 独活 = 僵尸 TP 组(gotcha #1)。正确做法是成对来:
#   make v4flash-stop && kubectl apply -f k8s/v4flash/   # apply 把 replicas 收敛回 1
# 2026-08-16 就是这么落地探针改动的,两侧同时加载,4m20s 恢复。
# (脚本本体不受此限——ConfigMap 热更,见 configmap-launch.yaml。)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: v4flash-worker
  namespace: v4flash
spec:
  replicas: 1            # 稳态 1(切换已完成 2026-08-13);停机用 make v4flash-stop
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: v4flash-worker
  template:
    metadata:
      labels:
        app: v4flash-worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: spark-2435
      hostNetwork: true
      hostIPC: true
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: docker.io/library/vllm-node-dsv4:latest
          imagePullPolicy: Never
          command: ["/bin/bash", "/scripts/rank1.sh"]
          workingDir: /workspace
          securityContext:
            privileged: true
          resources:
            limits:
              nvidia.com/gpu: 1
          env:
            - name: VLLM_HOST_IP
              value: "192.168.200.102"
            - name: NCCL_SOCKET_IFNAME
              value: "enp1s0f0np0"
            - name: GLOO_SOCKET_IFNAME
              value: "enp1s0f0np0"
            - name: TP_SOCKET_IFNAME
              value: "enp1s0f0np0"
            - name: UCX_NET_DEVICES
              value: "enp1s0f0np0"
            - name: OMPI_MCA_btl_tcp_if_include
              value: "enp1s0f0np0"
            - name: MN_IF_NAME
              value: "enp1s0f0np0"
            - name: NCCL_IB_HCA
              value: "rocep1s0f0,roceP2p1s0f0"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_IGNORE_CPU_AFFINITY
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            # JIT 缓存三兄弟 —— 2026-09-02 从线上收编。丢了它们每次 Pod 重启都要
            # 重编译 kernel(正是 warmer sidecar 在替它遮掩的那部分开销)。
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /root/.cache/torchinductor
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: vllm-cache
              mountPath: /root/.cache/vllm
            - name: flashinfer-cache
              mountPath: /root/.cache/flashinfer
            - name: triton-cache
              mountPath: /root/.triton
            - name: tilelang-cache
              mountPath: /root/.tilelang
            - name: cuda-cache
              mountPath: /root/.nv
            - name: inductor-cache
              mountPath: /root/.cache/torchinductor
            - name: scripts
              mountPath: /scripts
          # 共同命运:worker 是 --headless,没有自己的端点可探。判据 = 「leader 还是不是
          # 我当初 rendezvous 的那个进程」——不是就自杀,两侧一起重来重新 rendezvous。
          # (2026-08-13 演练教训:单侧重建 = 僵尸 TP 组,必须成组重启。)
          # 脚本在 configmap-launch.yaml 的 worker_liveness.py,那里有完整推理和
          # 2026-08-16「两边串行各加载一次 = ~11 分钟中断」的实测。
          # ⚠️ 下面这些探针字段改了要重建 Pod 才生效;脚本本身改完 kubelet 会自动同步。
          livenessProbe:
            exec:
              command: ["python3", "/scripts/worker_liveness.py"]
            # 脚本自己 fail-open 到「首次见到 leader」为止,不再靠这个值去猜
            # leader 的 167GB 加载要多久(原来是 900s)。
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 15
            # 脚本内已有连续 miss 计数(MISS_LIMIT=2),这里只留一次探针超时的余量。
            # 合计:leader 消失后 ~90s 自杀,与 leader 并行重装,而不是等它装完再排队。
            failureThreshold: 2
      volumes:
        - name: hf-cache
          hostPath:
            path: /home/admin/.cache/huggingface
        - name: vllm-cache
          hostPath:
            path: /home/admin/.cache/vllm
        - name: flashinfer-cache
          hostPath:
            path: /home/admin/.cache/flashinfer
        - name: triton-cache
          hostPath:
            path: /home/admin/.triton
        - name: tilelang-cache
          hostPath:
            path: /home/admin/.tilelang
            type: DirectoryOrCreate
        - name: cuda-cache
          hostPath:
            path: /home/admin/.nv
            type: DirectoryOrCreate
        - name: inductor-cache
          hostPath:
            path: /home/admin/.cache/torchinductor
            type: DirectoryOrCreate
        - name: scripts
          configMap:
            name: v4flash-launch
            defaultMode: 0755
