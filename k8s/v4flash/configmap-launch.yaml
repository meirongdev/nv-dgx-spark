# rank0.sh / rank1.sh = 2026-08-12 从生产容器 /workspace/exec-script.sh 逐字抓取
# (eugr run-recipe.sh --no-ray 对 config/deepseek-v4-flash.yaml 的渲染产物)。
# 改 vLLM 参数 → 改这里 + kubectl apply + 依次重建两个 Pod。
apiVersion: v1
kind: ConfigMap
metadata:
  name: v4flash-launch
  namespace: v4flash
data:
  # leader liveness:判据是「有活但**持续**零进展」,不是「探针请求能否返回」,
  # 也不是「相邻两次探测有没有推进」。两次误杀换来的这两条限定词,别去掉。
  #
  # 2026-08-13 事故:第一版探针发一个 max_tokens:1 的真实生成请求。引擎被真实流量
  # 打满(Running 6 / Waiting 2)时,探针请求排在队尾 → 连续 5 次超时 → kubelet
  # SIGKILL 掉一个完全健康的 leader,worker 5 分钟后跟着重启 = ~10 分钟无谓中断。
  # 教训:任何进入请求队列的探针都无法区分「卡死」和「忙」。
  #
  # 2026-08-16 事故:第二版改读 /metrics 不排队了,但只比较**相邻两次**的 steps,
  # 于是「有活」的那一瞬间只要 steps 还没 +1 就记一次失败。当天误报两次:
  #   16:32  `steps stuck at 76166` → 连续 3 次 → 杀掉健康 leader(日志显示它在被杀
  #          前 6 秒还在正常出 token),worker 6 分钟后跟着重启,总中断 ~11 分钟
  #   17:08  `steps stuck at 0`     → 重启后从未迭代过的冷引擎 + 首个请求在飞
  # 教训:「有活但这一分钟没推进」是常态而非卡死 —— 空闲后的第一个请求、超长
  # prefill、DG_JIT 首次编译新 shape 都会这样。判据必须是**连续停滞时长**。
  #
  # 现判据(/metrics 由 API server 直接应答,不进请求队列,满载和卡死时都秒回):
  #   demand == 0                  → 健康(空闲,不动是应该的),停滞秒表归零
  #   steps 比上次增加             → 健康(引擎在推进,不管多忙、多慢),秒表归零
  #   demand > 0 且 steps 连续不动 → 累计超过 STALL_S(默认 600s)才判失败
  # steps = vllm:iteration_tokens_total_count,每个 engine iteration +1;
  # 分块 prefill(max_num_batched_tokens=8192)保证超长提示也会持续推进。
  #
  # 阈值为什么给得这么松:误杀的代价是把一个**正在工作**的引擎变成 ~11 分钟中断;
  # 真卡死时晚 10 分钟发现,只是让一个**已经死了**的服务多死一会儿。不对称 → 宁松勿紧。
  #
  # 时间基准放在脚本里而不是 failureThreshold:ConfigMap 是普通卷挂载(非 subPath),
  # 改脚本 kubelet 会自动同步进运行中的容器、**不用重启 Pod**;改 Deployment 的探针
  # 字段则要重建两个 rank。调阈值同理,优先用 env 覆盖 STALL_S。
  # 回归测试:`make probe-test`(直接从本文件抽脚本跑,含上面两次误报的复现场景)。
  liveness.py: |
    import json, os, sys, time, urllib.request

    STALL_S    = float(os.environ.get("V4FLASH_STALL_S", "600"))
    MISS_LIMIT = int(os.environ.get("V4FLASH_MISS_LIMIT", "5"))
    STATE      = os.environ.get("V4FLASH_STATE", "/tmp/.v4flash_liveness")
    URL        = os.environ.get("V4FLASH_METRICS", "http://localhost:8000/metrics")

    now = time.monotonic()   # CLOCK_MONOTONIC = 开机时长,跨探针进程可比,且不受 NTP 跳变影响

    def load():
        try:
            with open(STATE) as f:
                return json.load(f)
        except Exception:
            return {}            # 状态缺失/损坏 = 重记基线,本轮放行

    def save(st):
        tmp = STATE + ".tmp"
        with open(tmp, "w") as f:
            json.dump(st, f)
        os.replace(tmp, STATE)   # 原子写:探针可能被 timeoutSeconds 杀在写一半

    st = load()

    try:
        body = urllib.request.urlopen(URL, timeout=10).read().decode()
    except Exception as e:
        # 抓不到通常是 API server 真没了,但也可能是一次瞬时抖动 ——
        # 单次超时不足以杀掉一个 TP 组,连续 MISS_LIMIT 次才算数。
        st["miss"] = miss = int(st.get("miss", 0)) + 1
        save(st)
        if miss >= MISS_LIMIT:
            sys.exit(f"metrics unreachable x{miss}: {e}")
        sys.exit(0)

    def metric(prefix):
        """返回 None 表示该指标此刻不存在 —— 与 0 严格区分。"""
        for line in body.splitlines():
            if line.startswith(prefix):
                return float(line.split()[-1])
        return None

    steps   = metric("vllm:iteration_tokens_total_count{")
    running = metric("vllm:num_requests_running{") or 0.0
    waiting = metric("vllm:num_requests_waiting{") or 0.0
    demand  = running + waiting

    prev  = st.get("steps")
    since = st.get("since")

    # 秒表归零 = 此刻没有「停滞」的证据。⚠️ `demand == 0` 这条是 2026-08-16 误杀的
    # 正解:停滞秒表只在**有活**期间累积,引擎空闲一整夜也不会攒下账,于是空闲后的
    # 第一个请求不会一进来就被判死。
    if steps is None or since is None or steps != prev or demand == 0:
        since = now

    save({"steps": steps, "since": since, "miss": 0})

    if steps is None or demand == 0 or steps != prev:
        sys.exit(0)

    stalled = now - since
    if stalled < STALL_S:
        sys.exit(0)              # 有活但零进展,还没到判死时长 —— 继续观察

    # 判死前最后一道保险:DG_JIT 走 nvcc 子进程编译(rank0.sh 里 DG_JIT_USE_NVRTC=0)、
    # Triton 走 ptxas,首次遇到新 shape 时引擎确实会很久不出新 iteration —— 那是在干活。
    # 容器有独立 PID namespace(没开 hostPID),这里只看得到 vLLM 自己的进程树。
    def compiler_running():
        for pid in os.listdir("/proc"):
            if not pid.isdigit():
                continue
            try:
                with open(f"/proc/{pid}/comm") as f:
                    if f.read().strip() in ("nvcc", "ptxas", "cicc", "cudafe++"):
                        return True
            except OSError:
                continue         # 进程刚退出
        return False

    try:
        if compiler_running():
            sys.exit(0)
    except OSError:
        pass                     # 读不了 /proc 就当没在编译,继续判死

    sys.exit(f"TP group appears hung: demand={demand:.0f}, steps stuck at {steps:.0f} for {stalled:.0f}s")
  # worker liveness:worker 是 --headless,没有自己的端点可探,它唯一该回答的问题是
  # 「leader 还是不是我当初 rendezvous 的那个进程」——不是就得自杀重来(单侧存活 =
  # 僵尸 TP 组,gotcha #1)。老版本只探 leader 的 /health 通不通,有两个毛病:
  #   1. leader 重启后 /health 会恢复 200,但那是**新进程**,worker 还挂在旧 TP 组上;
  #      只能靠「不通够 5 次」间接察觉,慢且不精确。
  #   2. 5×60s 才自杀,而 leader 重装权重也要 ~5min,于是两边**串行**重来。
  #      2026-08-16 实测:leader 16:32 被杀 → worker 16:38 才跟上 → 总中断 ~11 分钟。
  # 现在直接读 leader 的 process_start_time_seconds:变了 = leader 换过进程 → 立刻自杀,
  # 两边并行重来,中断收敛到一次加载(~5-6min)。
  worker_liveness.py: |
    import json, os, sys, urllib.request

    LEADER     = os.environ.get("V4FLASH_LEADER_METRICS", "http://192.168.200.101:8000/metrics")
    STATE      = os.environ.get("V4FLASH_WORKER_STATE", "/tmp/.v4flash_worker_liveness")
    MISS_LIMIT = int(os.environ.get("V4FLASH_WORKER_MISS", "2"))

    def load():
        try:
            with open(STATE) as f:
                return json.load(f)
        except Exception:
            return {}

    def save(st):
        tmp = STATE + ".tmp"
        with open(tmp, "w") as f:
            json.dump(st, f)
        os.replace(tmp, STATE)

    st = load()

    try:
        body = urllib.request.urlopen(LEADER, timeout=10).read().decode()
    except Exception as e:
        # 还没见过 leader = 冷启动窗口(leader 要 ~5min 装 167GB 权重),一律放行。
        # 这条取代了原来的 initialDelaySeconds: 900 —— 不再靠猜加载时长,
        # leader 装多久都不会误杀 worker。
        if not st.get("seen"):
            sys.exit(0)
        st["miss"] = miss = int(st.get("miss", 0)) + 1
        save(st)
        if miss >= MISS_LIMIT:
            sys.exit(f"leader gone x{miss}: {e}")
        sys.exit(0)

    start = None
    for line in body.splitlines():
        if line.startswith("process_start_time_seconds"):
            start = float(line.split()[-1])
            break

    prev = st.get("start")
    if prev is None:
        prev = start                      # 首次见到 leader:记下它的身份
    save({"seen": True, "start": prev, "miss": 0})

    if start is not None and prev is not None and start != prev:
        sys.exit(f"leader restarted (process_start_time {prev} -> {start})")
    sys.exit(0)
  # issue #55 热修:流式 tool call 被 max_tokens 截断时,服务端谎报
  # finish_reason="tool_calls",并把**没写完的** arguments 冲给客户端;harness 把它
  # 当成功调用写进历史 → 下一轮整段 transcript 被自己 400 掉。
  #
  # 2026-08-21 在本集群 :8000 上实测(scripts/repro-issue55.py):
  #   non-streaming  finish_reason=length、tool_calls=0            —— 不中招
  #   streaming      finish_reason="tool_calls"、args 截断成       —— 5/5 全中
  #                  '{"path":"/tmp/notes.md","content":"The'
  #   回放这条历史 → HTTP 400 "Unterminated string starting at: line 1 column 35"
  # codex / qwen 都走流式,中招的正是我们唯一在用的那条路。
  # (当时 5 天 916 次真实请求里 400 数为 0 —— 漏洞真实但尚未咬到过,属加固不属救火。)
  #
  # 判据完全挂在引擎自己的 FinishReason.LENGTH 上:模型自然结束的 tool call 一个字节
  # 不动,只有引擎说"我是被 length 截断的"时才改口径 + 丢掉不能解析成 JSON 的 args。
  #
  # ⚠️ 只有 rank0 需要 —— rank1 是 --headless,根本没有 OpenAI entrypoint。
  # ⚠️ 容器每次启动都是干净的可写层,所以必须每次 rank0.sh 都跑一遍;脚本是幂等的
  #    (已打过则打印 skipped)。
  # ⚠️ 三个锚点是逐字匹配 vllm/entrypoints/openai/chat_completion/serving.py 的源码。
  #    重建镜像换了 vLLM 版本后可能失配 —— 那时脚本 exit 1 并打 FAIL,但 rank0.sh
  #    **不会**因此拒绝启动(宁可少个热修,也不要 endpoint 起不来),只在日志里喊。
  #    验收:`make v4flash-hotfix-status`,或跑 scripts/repro-issue55.py。
  #
  # 来源:MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark(MIT)
  #      patches/hotfix-dsv4-issue55-tool-truncation.py @ 2026-08-21。
  #
  # ⚠️ 相对上游有**一处必须的改动**,别按上游原文改回去:
  # 上游两处写的是 `tool_calls = [...] or None`(空了就置 None)。那是按 Anemll
  # 0.25.2.dev0 写的;**我们这个 build 里这两个字段都不是 Optional**:
  #   DeltaMessage.tool_calls: list[DeltaToolCall] = Field(default_factory=list)
  #   ChatMessage.tool_calls : list[ToolCall]      = Field(default_factory=list)
  # 而 DeltaMessage 自带的 @model_serializer 里有一句
  #   if len(data.get("tool_calls", [])) == 0: data.pop("tool_calls", None)
  # 置成 None 后 data["tool_calls"] 存在且为 None → len(None) → 整个尾包序列化失败,
  # 客户端收到的是流中间插一个
  #   {"error":{"message":"Error serializing to JSON: PydanticSerializationError:
  #    ... TypeError: object of type 'NoneType' has no len()", "code":400}}
  # —— 比不打补丁更糟。2026-08-21 第一次上线就是这么炸的,重启第二次才修对。
  # 正解是赋**空 list**:vLLM 自己那句 serializer 会把空的 tool_calls 键直接删掉,
  # 线上格式和上游想要的完全一致。教训:锚点逐字命中 ≠ 语义可移植。
  hotfix-issue55.py: |
    #!/usr/bin/env python3
    """Issue #55 mitigation (recipe-side, no upstream vLLM change).

    When ``max_tokens`` truncates a request mid-tool-call (engine finish_reason =
    ``FinishReason.LENGTH``), stock vLLM reports ``finish_reason="tool_calls"``
    even though the call never completed, and the streaming flush path can hand
    the client a ``tool_calls[].function.arguments`` that does **not** parse as
    JSON. A harness that replays the broken call then sees the whole transcript
    rejected with HTTP 400 ("Unterminated string …").

    This hotfix makes two monotonically-safer edits to the chat-completions
    serving path (both in
    ``vllm/entrypoints/openai/chat_completion/serving.py``):

    1. **Streaming final chunk** — if the engine truncated for ``length``,
       report ``finish_reason="length"`` (not ``"tool_calls"``), and strip any
       non-JSON-parseable ``tool_calls`` from the trailing ``delta_message`` so
       invalid args are not flushed to the client. Natural-stop tool calls keep
       ``finish_reason="tool_calls"``.
    2. **Non-streaming** — if the engine truncated for ``length``, do *not*
       claim ``finish_reason="tool_calls"`` and drop any unparseable
       ``message.tool_calls`` (defense-in-depth; the parser normally does not
       flush partial args in non-streaming mode, but this guarantees it).

    The fix is gated entirely on the engine's own ``FinishReason.LENGTH`` signal
    so a normal model-terminated tool call is unchanged.

    Usage (inside the container, after vLLM source is on disk):
      python3 hotfix-dsv4-issue55-tool-truncation.py
      python3 hotfix-dsv4-issue55-tool-truncation.py /path/to/vllm
    """
    from __future__ import annotations

    import sys
    from pathlib import Path

    DEFAULT_VLLM = Path("/usr/local/lib/python3.12/dist-packages/vllm")
    MARK = "# [issue55-hotfix] tool-call truncation safety"
    SERVING = "entrypoints/openai/chat_completion/serving.py"

    # Module-level helper, inserted right after `import asyncio` (always present
    # at the top of this file, byte-stable).
    HELPER_ANCHOR = "import asyncio\n"
    HELPER_NEW = (
        "import asyncio\n"
        + MARK
        + "\n"
        "def _dsml_issue55_json_ok(s):\n"
        "    \"\"\"True iff `s` parses as a complete JSON value. None/'' are ok.\"\"\"\n"
        "    if s is None or s == \"\":\n"
        "        return True\n"
        "    try:\n"
        "        import json as _j\n"
        "        _j.loads(s)\n"
        "        return True\n"
        "    except Exception:\n"
        "        return False\n"
    )

    # --- Streaming final-chunk edit ---

    STREAMING_OLD = (
        "                        if tools_streamed[i] and not tool_choice_function_name:\n"
        "                            finish_reason_ = \"tool_calls\"\n"
        "                        else:\n"
        "                            finish_reason_ = (\n"
        "                                output.finish_reason if output.finish_reason else \"stop\"\n"
        "                            )"
    )

    STREAMING_NEW = (
        "                        " + MARK + " gate the tool_calls verdict on engine length,\n"
        "                        # and strip non-JSON args from the trailing delta.\n"
        "                        if (\n"
        "                            tools_streamed[i]\n"
        "                            and not tool_choice_function_name\n"
        "                            and str(output.finish_reason) != \"length\"\n"
        "                        ):\n"
        "                            finish_reason_ = \"tool_calls\"\n"
        "                        else:\n"
        "                            finish_reason_ = (\n"
        "                                str(output.finish_reason)\n"
        "                                if output.finish_reason\n"
        "                                else \"stop\"\n"
        "                            )\n"
        "                        if (\n"
        "                            str(output.finish_reason) == \"length\"\n"
        "                            and delta_message is not None\n"
        "                            and getattr(delta_message, \"tool_calls\", None)\n"
        "                        ):\n"
        "                            _kept = [\n"
        "                                tc\n"
        "                                for tc in delta_message.tool_calls\n"
        "                                if getattr(tc, \"function\", None)\n"
        "                                and _dsml_issue55_json_ok(tc.function.arguments)\n"
        "                            ]\n"
        "                            delta_message.tool_calls = _kept\n"
    )

    # --- Non-streaming edit ---

    NOSTREAM_OLD = (
        "            choice_data = ChatCompletionResponseChoice(\n"
        "                index=output.index,\n"
        "                message=message,\n"
        "                logprobs=logprobs,\n"
        "                finish_reason=\"tool_calls\"\n"
        "                if is_finish_reason_tool_calls\n"
        "                else output.finish_reason\n"
        "                if output.finish_reason\n"
        "                else \"stop\","
    )

    NOSTREAM_NEW = (
        "            " + MARK + " if the engine truncated for length, do not\n"
        "            # claim tool_calls ended cleanly, and drop unparseable args.\n"
        "            if str(output.finish_reason) == \"length\":\n"
        "                is_finish_reason_tool_calls = False\n"
        "                if getattr(message, \"tool_calls\", None):\n"
        "                    message.tool_calls = [\n"
        "                        tc\n"
        "                        for tc in message.tool_calls\n"
        "                        if getattr(tc, \"function\", None)\n"
        "                        and _dsml_issue55_json_ok(tc.function.arguments)\n"
        "                    ]\n"
        "            choice_data = ChatCompletionResponseChoice(\n"
        "                index=output.index,\n"
        "                message=message,\n"
        "                logprobs=logprobs,\n"
        "                finish_reason=\"tool_calls\"\n"
        "                if is_finish_reason_tool_calls\n"
        "                else str(output.finish_reason)\n"
        "                if output.finish_reason\n"
        "                else \"stop\","
    )


    def _patch_file(path: Path, old: str, new: str, what: str) -> str:
        """Apply `new` over `old` once; idempotent. Returns applied|skipped|missing."""
        source = path.read_text(encoding="utf-8")
        if new in source:
            return "skipped"
        if old not in source:
            return "missing"
        path.write_text(source.replace(old, new, 1), encoding="utf-8")
        return "applied"


    def main() -> int:
        if len(sys.argv) > 1 and sys.argv[1] == "--status":
            root = Path(sys.argv[2]) if len(sys.argv) > 2 else DEFAULT_VLLM
            p = root / SERVING
            applied = p.is_file() and MARK in p.read_text(encoding="utf-8")
            print("issue55 tool-call truncation    :", "APPLIED" if applied else "NOT APPLIED")
            return 0
        vllm_root = Path(sys.argv[1]) if len(sys.argv) > 1 else DEFAULT_VLLM
        path = vllm_root / SERVING
        if not path.is_file():
            print(f"[FAIL] serving file not found: {path}", file=sys.stderr)
            return 1
        print(f"[issue55-hotfix] patching {path}")
        for name, old, new in [
            ("module helper", HELPER_ANCHOR, HELPER_NEW),
            ("streaming final chunk", STREAMING_OLD, STREAMING_NEW),
            ("non-streaming final choice", NOSTREAM_OLD, NOSTREAM_NEW),
        ]:
            status = _patch_file(path, old, new, name)
            if status == "missing":
                print(f"[FAIL] {name}: anchor not found in {path.name}")
                return 1
            print(f"[issue55-hotfix] {name}: {status}")
        print(f"[issue55-hotfix] done (mark: {MARK})")
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
  rank0.sh: |
    #!/bin/bash
    # Generated from recipe: DeepSeek-V4-Flash
    # Environment variables
    export TORCH_CUDA_ARCH_LIST="12.1a"
    export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
    export VLLM_TRITON_MLA_SPARSE="1"
    export FLASHINFER_DISABLE_VERSION_CHECK="1"
    export TILELANG_CLEANUP_TEMP_FILES="1"
    export DG_JIT_USE_NVRTC="0"
    export DG_JIT_NVCC_COMPILER="/usr/local/cuda/bin/nvcc"
    export DG_JIT_PRINT_COMPILER_COMMAND="1"
    export NCCL_IB_DISABLE="0"
    export NCCL_DEBUG="WARN"
    # issue #55 热修(推理见本 ConfigMap 里 hotfix-issue55.py 上方的注释)。
    # 故意不 set -e、不 exit:热修失配也要让 endpoint 起来,只在日志里喊。
    python3 /scripts/hotfix-issue55.py \
      || echo "[rank0] !!! issue55 hotfix FAILED — 流式 tool call 截断会谎报 finish_reason"
    # Run the model
    vllm serve /root/.cache/huggingface/hub/DeepSeek-V4-Flash-0731 \
        --served-model-name deepseek-v4-flash \
        --host 0.0.0.0 \
        --port 8000 \
        --trust-remote-code \
        --tensor-parallel-size 2 \
        --pipeline-parallel-size 1 \
        --kv-cache-dtype fp8 \
        --block-size 256 \
        --enable-prefix-caching \
        --max-model-len 1000000 \
        --max-num-seqs 6 \
        --max-num-batched-tokens 8192 \
        --gpu-memory-utilization 0.8 \
        --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
        --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"greedy"}' \
        --override-generation-config '{"top_p":0.95}' \
