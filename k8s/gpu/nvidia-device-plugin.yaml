# NVIDIA device plugin — vendored 自 NVIDIA/k8s-device-plugin v0.17.4 官方 manifest
# (GitHub raw 在 DGX 上不可直连,故入库;镜像经 registries.yaml 走 nvcr.m.daocloud.io)
#
# ⚠️ GB10 统一内存要求 v0.17.4+:旧版崩溃
#    "error getting device memory: Not Supported" (NVIDIA/gpu-operator#1794)
# 本地改动: 增加 runtimeClassName: nvidia (k3s containerd 的 nvidia handler)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.17.4
          name: nvidia-device-plugin-ctr
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
